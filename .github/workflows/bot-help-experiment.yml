name: Bot help experiment

on:
  push:
    branches: [experiment/bot-help-index]
    paths:
      - bot/experiments/botHelp/**
      - bot/tag-bot/help/**
      - scripts/bot-help-experiment.mjs
      - scripts/bot-help-preview.mjs
      - scripts/bot-help-refresh.mjs
      - .github/workflows/bot-help-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    if: github.repository == 'EladHeller/wiki-bot' && github.ref == 'refs/heads/experiment/bot-help-index'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        model: [gpt-4o-mini, gpt-4.1-mini]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.0
      - run: npm ci
      - run: npm run build
      - name: Prepare public wiki context
        run: node scripts/bot-help-experiment.mjs --prepare
      - name: Run bounded tag preview
        env:
          BOT_HELP_MODEL: ${{ matrix.model }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/bot-help-preview.mjs
      - name: Verify documentation refresh in an isolated index
        if: matrix.model == 'gpt-4o-mini'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/bot-help-refresh.mjs --verify
      - name: Publish experiment report
        if: always()
        run: |
          if [ -f experiment-output/bot-help/report.md ]; then
            cat experiment-output/bot-help/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bot-help-experiment-${{ matrix.model }}
          path: experiment-output/bot-help/
          retention-days: 7
